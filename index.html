<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iruvada Village Land Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033;overflow:hidden}
#map{position:fixed;inset:0;background:#e9edf2}
.topbar{position:fixed;z-index:1100;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.icon-btn{pointer-events:auto;width:48px;height:48px;border:0;border-radius:13px;background:rgba(255,255,255,.96);box-shadow:0 5px 18px rgba(0,0,0,.22);font-size:25px;cursor:pointer;color:#172033}
.gps-btn{pointer-events:auto;height:48px;border:0;border-radius:13px;background:#1478e8;color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.22);padding:0 15px;font-size:14px;font-weight:800;cursor:pointer}
.gps-btn:disabled{opacity:.75}.gps-btn:active,.icon-btn:active{transform:translateY(1px)}
.menu{position:fixed;z-index:1200;top:68px;left:12px;width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 82px);overflow:auto;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border:1px solid #dce2ea;border-radius:15px;box-shadow:0 10px 32px rgba(0,0,0,.25);padding:12px;display:none}
.menu.open{display:block}.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.menu-title{font-weight:800;font-size:18px}.close{border:0;background:transparent;font-size:25px;cursor:pointer;color:#667085;padding:2px 7px}
.menu-section{border-top:1px solid #e7ebf0;padding:11px 0}.menu-section:first-of-type{border-top:0;padding-top:3px}.menu-label{font-size:13px;font-weight:800;color:#475467;margin-bottom:8px}
.choice-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.choice{border:1px solid #cbd3de;background:#fff;border-radius:9px;padding:9px 6px;font-weight:750;font-size:13px;cursor:pointer}.choice.active{background:#1478e8;color:#fff;border-color:#1478e8}
.search{display:flex;gap:7px}.search input{min-width:0;flex:1;padding:10px 11px;border:1px solid #cbd3de;border-radius:9px;font-size:14px;outline:none}.search input:focus{border-color:#1478e8;box-shadow:0 0 0 3px rgba(20,120,232,.12)}.search button{border:0;border-radius:9px;padding:10px 13px;background:#1478e8;color:#fff;font-size:13px;font-weight:800;cursor:pointer}
.status{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f3f7fb;color:#536174;font-size:12px;line-height:1.35}.status.ok{background:#eaf8ef;color:#1d6a39}.status.err{background:#fff0f0;color:#a22929}
.layer-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}.layer-row input{width:17px;height:17px;accent-color:#1478e8}
.lp-label{
  background:rgba(255,255,255,.85);
  border:1px solid rgba(0,0,0,.35);
  border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  color:#111827;
  font-size:11px;
  font-weight:800;
  padding:2px 4px;
  white-space:nowrap;
  text-align:center;
}
.lp-label:before{
  display:none;
}
.lp-label{
  background:rgba(255,255,255,.85);
  border:1px solid rgba(0,0,0,.35);
  border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  color:#111827;
  font-size:11px;
  font-weight:800;
  padding:2px 4px;
  white-space:nowrap;
  text-align:center;
}

.lp-label:before{
  display:none;
} 
.legend{display:flex;align-items:center;gap:7px;font-size:12px;color:#667085;margin-top:7px}.blue-line{width:25px;border-top:3px solid #0878ff}.red-line{width:25px;border-top:4px solid #ff1f1f}
.about{font-size:11px;color:#718096;line-height:1.4}.leaflet-popup-content-wrapper{border-radius:12px}.leaflet-popup-content{margin:13px 15px;min-width:220px;max-width:290px}.popup h3{margin:0 0 8px;font-size:18px}.popup-row{margin:4px 0;font-size:13px;line-height:1.35}.popup-row b{font-weight:750}.popup-note{font-size:11px;color:#6b7280;margin-top:8px;border-top:1px solid #eee;padding-top:7px}.leaflet-control-zoom{margin-top:70px!important}
@media(max-width:700px){.topbar{top:8px;left:8px;right:8px}.icon-btn,.gps-btn{height:46px}.icon-btn{width:46px}.gps-btn{font-size:13px;padding:0 12px}.menu{top:62px;left:8px;width:calc(100vw - 16px);max-height:calc(100vh - 72px)}}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
  <button id="gps" class="gps-btn">📍 Find My Land</button>
</div>
<div id="menu" class="menu">
  <div class="menu-head"><div class="menu-title">Iruvada Land Map</div><button id="closeMenu" class="close">×</button></div>
  <div class="menu-section">
    <div class="menu-label">Search by</div>
    <div class="choice-row">
      <button class="choice active" data-type="lp">LP Number</button>
      <button class="choice" data-type="khata">Khata Number</button>
      <button class="choice" data-type="survey">Survey Number</button>
    </div>
  </div>
  <div class="menu-section">
    <div class="search"><input id="q" placeholder="Enter LP number" autocomplete="off"><button id="searchBtn">Search</button></div>
    <div id="searchStatus" class="status" style="display:none"></div>
    <div class="legend"><span class="red-line"></span><span>Search result / GPS-matched parcel(s)</span></div>
    <div class="legend"><span class="blue-line"></span><span>All LP boundaries</span></div>
  </div>
  <div class="menu-section">
    <div class="menu-label">Map layers</div>
    <label class="layer-row"><input type="radio" name="base" value="sat" checked> Satellite imagery</label>
    <label class="layer-row"><input type="radio" name="base" value="osm"> OpenStreetMap</label>
    <label class="layer-row"><input type="checkbox" id="boundaries" checked> Show LP boundaries</label>
  </div>
  <div class="menu-section about">For public use (UNOFFICIAL). Land-record details shown by this map are based on the available dataset; the official source remains AP BhuNaksha.</div>
</div>
<script>
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([18.5748,83.5485],16);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});sat.addTo(map);
let landLayer=null,features=[],loaded=false;let selectedLayers=[];let gpsDot=null,gpsAccuracy=null;let searchType='lp';
const blue={color:'#0878ff',weight:2.2,opacity:.95,fillColor:'#0878ff',fillOpacity:.025};
const red={color:'#ff1f1f',weight:4,opacity:1,fillColor:'#ff1f1f',fillOpacity:.09};
function val(x){return x===undefined||x===null||x===''||x==='#N/A'?'—':String(x)}
function popupHtml(p){return `<div class="popup"><h3>LP No. ${val(p.LPNo||p.lpm)}</h3><div class="popup-row"><b>Survey No.:</b> ${val(p.Survey_No)}</div><div class="popup-row"><b>Extent:</b> ${val(p.Extent)}</div><div class="popup-row"><b>Land Nature:</b> ${val(p.Land_Nature)}</div><div class="popup-row"><b>Classification:</b> ${val(p.Land_Classification)}</div><div class="popup-row"><b>Khata No.:</b> ${val(p.Khata_No)}</div><div class="popup-row"><b>Pattadar:</b> ${val(p.Pattadar)}</div><div class="popup-row"><b>Father/Husband:</b> ${val(p.Father_Husband)}</div><div class="popup-note">Official source: AP BhuNaksha link is stored for this LP.</div></div>`}
function clearHighlights(){selectedLayers.forEach(l=>l.setStyle(blue));selectedLayers=[]}
function highlight(featuresToHighlight,fit=true){clearHighlights();const targets=[];featuresToHighlight.forEach(f=>{landLayer.eachLayer(l=>{if(l.feature===f){l.setStyle(red);targets.push(l)}})});selectedLayers=targets;if(fit&&targets.length){let group=L.featureGroup(targets);const b=group.getBounds();if(b.isValid())map.fitBounds(b.pad(.25),{maxZoom:18,animate:true})}}
function loadLand(){
  fetch('land.geojson')
    .then(r=>{
      if(!r.ok) throw new Error('land.geojson could not be loaded');
      return r.json();
    })
    .then(g=>{
      features=g.features||[];
      loaded=true;

      landLayer=L.geoJSON(g,{
        style:blue,

        onEachFeature:(f,l)=>{
          const p=f.properties||{};
          const lp=val(p.LPNo||p.lpm);

          // Normal popup with land details
          l.bindPopup(
            popupHtml(p),
            {
              closeButton:true,
              autoPan:true
            }
          );

          // LP number label
          if(lp){
            l.bindTooltip(
              'LP ' + lp,
              {
                permanent:true,
                direction:'center',
                className:'lp-label',
                opacity:1,
                interactive:false
              }
            );
          }

          // Click parcel = highlight + show details
          l.on('click',()=>{
            clearHighlights();
            l.setStyle(red);
            selectedLayers=[l];
          });
        }
      }).addTo(map);

      const b=landLayer.getBounds();

      if(b.isValid()){
        map.fitBounds(b.pad(.04));
      }

      // Show/hide LP numbers according to zoom level
      setTimeout(updateLPLabels,500);
    })
    .catch(e=>{
      console.error(e);
      alert(
        'Land boundary data could not be loaded. Make sure index.html and land.geojson are in the same GitHub Pages folder.'
      );
    });
}


// LP number visibility
function updateLPLabels(){
  if(!landLayer) return;

  const showLabels = map.getZoom() >= 17;

  landLayer.eachLayer(l=>{
    if(l.getTooltip()){
      if(showLabels){
        l.openTooltip();
      }else{
        l.closeTooltip();
      }
    }
  });
}


// Update labels whenever the user zooms
map.on('zoomend',updateLPLabels);


// Load land
loadLand();
function fieldValue(p,type){if(type==='lp')return [p.LPNo,p.lpm];if(type==='khata')return [p.Khata_No];return [p.Survey_No]}
function search(){const q=document.getElementById('q').value.trim().toLowerCase();const s=document.getElementById('searchStatus');if(!q){s.style.display='block';s.className='status err';s.textContent='Enter a number to search.';return}if(!loaded){s.style.display='block';s.className='status';s.textContent='Loading land boundaries…';return}
 const matches=features.filter(f=>{const p=f.properties||{};return fieldValue(p,searchType).some(v=>{if(v==null)return false;const text=String(v).toLowerCase();const parts=text.split(',').map(x=>x.trim()).filter(Boolean);return parts.includes(q)|| (searchType==='lp' && text===q);})&&f.geometry});
 if(!matches.length){s.style.display='block';s.className='status err';s.textContent='No matching LP parcel found.';return}
 highlight(matches,true);s.style.display='block';s.className='status ok';if(searchType==='lp')s.textContent=`LP ${q} found. It is highlighted in red. Tap the red parcel to open details.`;else if(searchType==='khata')s.textContent=`${matches.length} LP parcel${matches.length>1?'s':''} found for Khata ${q}. All are highlighted in red.`;else s.textContent=`${matches.length} LP parcel${matches.length>1?'s':''} found for Survey ${q}. All are highlighted in red. Tap a parcel to open details.`}
document.getElementById('searchBtn').onclick=search;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));btn.classList.add('active');searchType=btn.dataset.type;const q=document.getElementById('q');q.value='';q.placeholder=searchType==='lp'?'Enter LP number':searchType==='khata'?'Enter Khata number':'Enter Survey number';document.getElementById('searchStatus').style.display='none';clearHighlights()});
document.querySelectorAll('input[name="base"]').forEach(r=>r.addEventListener('change',e=>{if(e.target.value==='osm'){map.removeLayer(sat);osm.addTo(map)}else{map.removeLayer(osm);sat.addTo(map)}}));document.getElementById('boundaries').addEventListener('change',e=>{if(!landLayer)return;e.target.checked?landLayer.addTo(map):map.removeLayer(landLayer)});
const menu=document.getElementById('menu');document.getElementById('menuBtn').onclick=()=>menu.classList.toggle('open');document.getElementById('closeMenu').onclick=()=>menu.classList.remove('open');
function gps(){const s=document.getElementById('gps');if(!window.isSecureContext){alert('GPS requires the HTTPS GitHub Pages website.');return}if(!navigator.geolocation){alert('This browser does not support GPS location.');return}s.disabled=true;s.textContent='📍 Getting location…';navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lon=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);s.disabled=false;s.textContent='📍 Find My Land';if(!loaded)return;const pt=turf.point([lon,lat]);let found=[];for(const f of features){try{if(f.geometry&&turf.booleanPointInPolygon(pt,f))found.push(f)}catch(e){}}map.setView([lat,lon],18,{animate:true});if(gpsAccuracy)map.removeLayer(gpsAccuracy);if(gpsDot)map.removeLayer(gpsDot);gpsAccuracy=L.circle([lat,lon],{radius:acc,color:'#1976ff',weight:1,opacity:.55,fillColor:'#1976ff',fillOpacity:.08,interactive:false}).addTo(map);gpsDot=L.circleMarker([lat,lon],{radius:8,color:'#fff',weight:3,fillColor:'#1976ff',fillOpacity:1,interactive:false}).addTo(map);if(found.length)highlight(found,false)},err=>{s.disabled=false;s.textContent='📍 Find My Land';alert(err.code===1?'Location permission was denied. Allow Location for this HTTPS site in Chrome settings.':err.code===2?'Location unavailable. Check GPS/location services.':'GPS timed out. Try again outdoors.')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
document.getElementById('gps').onclick=gps;
</script>
</body>
</html>
